name: Make All Repos Private

on:
  workflow_dispatch: # ڕێگەت پێدەدات بە کرتەیەک کاری پێ بکەیت

jobs:
  lock_repos:
    runs-on: ubuntu-latest
    steps:
      - name: Lock All Repositories
        uses: actions/github-script@v6
        env:
          MY_TOKEN: ${{ secrets.MY_TOKEN }}
        with:
          github-token: ${{ env.MY_TOKEN }}
          script: |
            try {
              // هێنانی لیستی هەموو پرۆژەکانت
              const repos = await github.paginate(github.rest.repos.listForAuthenticatedUser, {
                per_page: 100
              });
              
              let count = 0;
              for (const repo of repos) {
                // ئەگەر پرۆژەکە کراوە (Public) بوو، ئەوا دەیکات بە قوفڵ (Private)
                if (repo.private === false) {
                  console.log(`Locking ${repo.name}...`);
                  await github.rest.repos.update({
                    owner: repo.owner.login,
                    repo: repo.name,
                    private: true
                  });
                  count++;
                }
              }
              console.log(`Successfully locked ${count} repositories.`);
            } catch (error) {
              console.log("Error:", error.message);
            }
